name: P2Flux API
description: >-
  Non-custodial USDC payments API on the Base blockchain. Provides REST endpoints for one-time USDC payment intents with
  on-chain verification, recurring/subscription payments with merchant-triggered charges, and refunds. Payments are
  authorized per-request via HMAC-signed capabilities plus the payer's EIP-712 wallet signature — no signup, no
  dashboard, no issued credentials, and no custody of funds.
