summary: >-
  P2Flux asserts no compliance certifications (no SOC 2 / ISO / PCI — it is non-custodial
  and never holds funds) and does not use RFC 9457. Its domain-standard signature is the
  Ethereum/EVM stack it settles on: EIP-712 typed-data signatures for payer authorization
  and ERC-20 (USDC) transfers on Base. These are the market standards a crypto-payments
  integrator already speaks.
